[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onekeylib"
version = "0.1.0"
description = "OneKey hardware wallet Python library (Protocol V1 & V2, Bitcoin), derived from trezorlib"
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "OneKey"},
]
dependencies = [
    "libusb1>=3.0.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onekeylib = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
