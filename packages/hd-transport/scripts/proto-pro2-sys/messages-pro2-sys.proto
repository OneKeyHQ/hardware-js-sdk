// Pro2 System Protocol Messages (60000-61199 range)
//
// These messages are used over the Protocol V2 (0x5A) transport layer.
// Message IDs are in little-endian format in the frame header.
//
// Source of truth: webusb_test.html encoder/decoder comments
// This file is the authoritative .proto definition for the Pro2 sys API.

syntax = "proto2";

// ============================================================
// Message Type Enum
// ============================================================
enum MessageType {
    MessageType_Ping                    = 60206;
    MessageType_Success                 = 60207;
    MessageType_Failure                 = 60208;
    MessageType_Reboot                  = 60400;
    MessageType_FixPermission           = 60800;
    MessageType_PathInfo                = 60801;
    MessageType_PathInfoQuery           = 60802;
    MessageType_File                    = 60803;
    MessageType_FileRead                = 60804;
    MessageType_FileWrite               = 60805;
    MessageType_FileDelete              = 60806;
    MessageType_Dir                     = 60807;
    MessageType_DirList                 = 60808;
    MessageType_DirMake                 = 60809;
    MessageType_DirRemove               = 60810;
    MessageType_FirmwareUpdate          = 61000;
    MessageType_FirmwareInstallProgress = 61001;
}

// ============================================================
// Enums
// ============================================================

enum FailureType {
    Failure_UnexpectedMessage  = 1;
    Failure_ButtonExpected     = 2;
    Failure_DataError          = 3;
    Failure_ActionCancelled    = 4;
    Failure_PinExpected        = 5;
    Failure_PinCancelled       = 6;
    Failure_PinInvalid         = 7;
    Failure_InvalidSignature   = 8;
    Failure_ProcessError       = 9;
    Failure_NotEnoughFunds     = 10;
    Failure_NotInitialized     = 11;
    Failure_PinMismatch        = 12;
    Failure_WipeCodeMismatch   = 13;
    Failure_InvalidSession     = 14;
    Failure_FirmwareError      = 99;
}

enum FirmwareTargetType {
    TARGET_MAIN_APP      = 0;
    TARGET_MAIN_BOOT     = 1;
    TARGET_BLE           = 2;
    TARGET_SE1           = 3;
    TARGET_SE2           = 4;
    TARGET_SE3           = 5;
    TARGET_SE4           = 6;
    TARGET_RESOURCE      = 10;
}

enum RebootType {
    REBOOT_NORMAL       = 0;
    REBOOT_BOARDLOADER  = 1;
    REBOOT_BOOTLOADER   = 2;
}

// ============================================================
// Common / Response Messages
// ============================================================

// Sent to host: Ping response or general success
message Success {
    optional string message = 1;
}

// Sent to host: Error response
message Failure {
    optional FailureType code    = 1;
    optional string      message = 2;
}

// ============================================================
// Management
// ============================================================

// Host → Device: echo test
// Device → Host: Success(message) or Failure
message Ping {
    optional string message           = 1;
    optional bool   button_protection = 2;
}

// Host → Device: reboot into normal / boardloader / bootloader
message Reboot {
    required RebootType reboot_type = 1;
}

// ============================================================
// Filesystem
// ============================================================

// Host → Device: fix EMMC filesystem permissions
// Device → Host: Success or Failure
message FixPermission {
    optional string path = 1;
}

// Host → Device: query file/dir metadata
// Device → Host: PathInfo
message PathInfoQuery {
    required string path = 1;
}

// Device → Host: file/dir metadata response
message PathInfo {
    required bool   exist     = 1;
    required uint64 size      = 2;
    required uint32 year      = 3;
    required uint32 month     = 4;
    required uint32 day       = 5;
    required uint32 hour      = 6;
    required uint32 minute    = 7;
    required uint32 second    = 8;
    optional bool   readonly  = 9;
    optional bool   hidden    = 10;
    optional bool   system    = 11;
    optional bool   archive   = 12;
    optional bool   directory = 13;
}

// Shared file descriptor — used in FileRead/FileWrite requests and File responses
message File {
    required string path           = 1;
    required uint32 offset         = 2;
    required uint32 total_size     = 3;
    optional bytes  data           = 4;
    optional uint32 data_hash      = 5;
    optional uint32 processed_byte = 6;
}

// Host → Device: read a chunk from a file
// Device → Host: File(data=chunk_bytes, offset, total_size)
message FileRead {
    required File   file           = 1;
    optional uint32 chunk_len      = 2;
    optional uint32 ui_percentage  = 3;
}

// Host → Device: write a chunk to a file
// Device → Host: File(processed_byte) or Failure
message FileWrite {
    required File   file           = 1;
    required bool   overwrite      = 2;
    required bool   append         = 3;
    optional uint32 ui_percentage  = 4;
}

// Host → Device: delete a file
// Device → Host: Success or Failure
message FileDelete {
    required string path = 1;
}

// Host → Device: list directory contents
// Device → Host: Dir
message DirList {
    required string path = 1;
}

// Device → Host: directory listing response
// child_dirs and child_files are comma-separated name lists
message Dir {
    required string path        = 1;
    optional string child_dirs  = 2;
    optional string child_files = 3;
}

// Host → Device: create a directory
// Device → Host: Success or Failure
message DirMake {
    required string path = 1;
}

// Host → Device: remove a directory (must be empty)
// Device → Host: Success or Failure
message DirRemove {
    required string path = 1;
}

// ============================================================
// Firmware Update
// ============================================================

message FirmwareTarget {
    required FirmwareTargetType target_id = 1;
    required string             path      = 2;
}

// Host → Device: initiate firmware update
// Device → Host: FirmwareInstallProgress (repeated) then Success or Failure
message FirmwareUpdate {
    repeated FirmwareTarget targets           = 1;
    optional bool           reboot_on_success = 2;
}

// Device → Host: firmware installation progress notification
message FirmwareInstallProgress {
    required uint32 progress = 1;
}
