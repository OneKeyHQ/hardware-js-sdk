// Compatibility snapshot: OneKeyHQ/firmware-pro2 @ 01bf80cbe70c58bd0a91a4a504c7c730ef972892
// Source: sys/protobuf/onekey_protocol/legacy/messages_zcash.proto
// The SDK already exports this contract; keep it until the pinned firmware includes it.
syntax = "proto2";
package hw.onekey.messages.zcash;

enum ZcashAddressType {
  UNIFIED_ORCHARD_P2PKH = 0;
  TRANSPARENT_P2PKH = 1;
  UNIFIED_ORCHARD = 2;
}

enum ZcashAddressScope {
  EXTERNAL = 0; // Receiving addresses
  INTERNAL = 1; // Change addresses
}

/**
 * Request: address for the specified account, index and scope
 * @start
 * @next ZcashAddress
 */
message ZcashGetAddress {
  repeated uint32 address_n = 1; // ZIP-32 account path m/32'/133'/account', including for transparent addresses
  optional bool show_display = 2; // optionally show on display before sending the result
  optional bool include_seed_fingerprint = 3;
  optional uint32 diversifier_index = 5 [default = 0]; // 32-bit subset of ZIP-32's 88-bit index; transparent receivers require < 2^31.
  optional ZcashAddressType address_type = 6 [default = UNIFIED_ORCHARD_P2PKH];
  optional ZcashAddressScope scope = 7 [default = EXTERNAL]; // Applies to all selected receivers.
}

/**
 * Response: address and optional seed fingerprint
 * @end
 */
message ZcashAddress {
  required string address = 1; // ZIP-316 UA or transparent P2PKH address
  optional bytes seed_fingerprint = 3; // ZIP-32 seed fingerprint
}

/**
 * Request: account UFVK, exported only after confirmation on the device
 * @start
 * @next ZcashFullViewingKey
 * @next Failure
 */
message ZcashGetFullViewingKey {
  repeated uint32 address_n = 1; // ZIP-32 account path m/32'/133'/account'
}

/**
 * Response: account UFVK containing transparent and Orchard full viewing keys
 * @end
 */
message ZcashFullViewingKey {
  required string ufvk = 1;
}

/**
 * Request: PCZT to be signed
 * @start
 * @next ZcashSignedPczt
 * @next Failure
 * @next ZcashPcztChunkRequest
 */
message ZcashSignPczt {
  required uint32 pczt_length = 1;
  required bytes pczt_initial_chunk = 2;
}

/**
 * Request: Request the next chunk of the PCZT
 * @next ZcashPcztChunkAck
 */
message ZcashPcztChunkRequest {
  required uint32 chunk_length = 1;
}

/**
 * PCZT chunk used in either transfer direction
 * @next ZcashPcztChunkRequest
 * @next ZcashSignedPczt
 * @next ZcashSignedPcztChunkRequest
 * @next Failure
 * @next end
 */
message ZcashPcztChunkAck {
  required bytes data_chunk = 1;
}

/**
 * Response: Signed PCZT
 * @next ZcashSignedPcztChunkRequest
 * @next Failure
 * @next end
 */
message ZcashSignedPczt {
  required uint32 pczt_length = 1;
  required bytes pczt_initial_chunk = 2;
}

/**
 * Request: Request the next chunk of the signed PCZT
 * @next ZcashPcztChunkAck
 */
message ZcashSignedPcztChunkRequest {
  required uint32 chunk_length = 1;
}
