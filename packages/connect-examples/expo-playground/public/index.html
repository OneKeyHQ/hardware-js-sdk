<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneKey Developer Playground</title>
    <meta name="description" content="Interactive playground for OneKey Hardware SDK. Test hardware wallet APIs, manage devices, and explore blockchain integrations.">
    <meta name="theme-color" content="#000000">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="OneKey Developer Playground">
    <meta property="og:description" content="Interactive playground for OneKey Hardware SDK. Test hardware wallet APIs and blockchain integrations.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="<%= BASE_PATH %>og.jpg">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OneKey Developer Playground">
    <meta name="twitter:description" content="Interactive playground for OneKey Hardware SDK. Test hardware wallet APIs and blockchain integrations.">
    <meta name="twitter:creator" content="@OneKeyHQ">
    <meta name="twitter:site" content="@OneKeyHQ">
    <meta name="twitter:image" content="<%= BASE_PATH %>og.jpg">

    <!-- Favicon and icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_PATH %>favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_PATH %>favicon-16x16.png">
    <link rel="apple-touch-icon" href="<%= BASE_PATH %>apple-touch-icon.png">
    <link rel="shortcut icon" href="<%= BASE_PATH %>favicon-32x32.png">
    
    <!-- 基础样式 -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f5f5f5;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* 加载动画 */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;
        gap: 1rem;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #00d4aa;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 初始加载状态 -->
      <div class="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading OneKey SDK Example...</div>
      </div>
    </div>
    
    <!-- React 应用会替换这个内容 -->
  </body>
</html>
