<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneKey Developer Playground</title>
  <meta name="description"
    content="Interactive playground for OneKey Hardware SDK. Test hardware wallet APIs, manage devices, and explore blockchain integrations.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="OneKey Developer Playground">
  <meta property="og:description"
    content="Interactive playground for OneKey Hardware SDK. Test hardware wallet APIs and blockchain integrations.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hardware-example.onekeytest.com/expo-playground/">
  <meta property="og:image" content="https://hardware-example.onekeytest.com/expo-playground/og.jpg">
  <meta property="og:image:secure_url" content="https://hardware-example.onekeytest.com/expo-playground/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="OneKey Developer Playground">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OneKey Developer Playground">
  <meta name="twitter:description"
    content="Interactive playground for OneKey Hardware SDK. Test hardware wallet APIs and blockchain integrations.">
  <meta name="twitter:creator" content="@OneKeyHQ">
  <meta name="twitter:site" content="@OneKeyHQ">
  <meta name="twitter:image" content="https://hardware-example.onekeytest.com/expo-playground/og.jpg">
  <meta name="twitter:image:alt" content="OneKey Developer Playground">
  <script>
    // 简化的路由分发器
    (function () {
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      const fullUrl = search + hash;

      console.log('Route dispatcher: handling path', path);

      // 智能路由分发逻辑 - 保持原始URL不变，让SPA自己处理路由
      if (path.startsWith('/expo-playground/')) {
        const base = '/expo-playground';
        const relativePath = path.slice(base.length);

        if (relativePath && relativePath !== '/') {
          console.log('Handling expo-playground sub-route:', path);
          const normalized = relativePath.startsWith('/') ? relativePath : `/${relativePath}`;
          const hashPath = normalized.startsWith('/') ? `#${normalized}` : `#/${normalized}`;
          window.location.replace(`${base}/${hashPath}${search}${hash}`);
          return;
        }
        return;
      }

      if (path.startsWith('/expo-example/')) {
        // expo-example 的子路由，保存原始路径信息
        if (path !== '/expo-example/' && path !== '/expo-example') {
          console.log('Handling expo-example sub-route:', path);
          // 保存完整的原始URL到sessionStorage供应用恢复路由
          sessionStorage.setItem('spa_redirect_url', path + fullUrl);
          // 重定向到应用首页，让React Navigation处理路由恢复
          window.location.replace('/expo-example/');
          return;
        }
        return;
      }

      // 所有其他路径都重定向到 expo-playground
      console.log('Route dispatcher: redirecting', path, 'to expo-playground');
      window.location.replace('/expo-playground' + fullUrl);
    })();
  </script>
</head>

<body>
  <div style="font-family: Arial, sans-serif; text-align: center; margin-top: 100px;">
    <h2>OneKey Hardware SDK</h2>
    <p>Redirecting to Developer Portal...</p>
    <div style="margin: 30px 0;">
      <a href="/expo-playground/"
        style="color: #007bff; text-decoration: none; padding: 15px 30px; border: 2px solid #007bff; border-radius: 8px; display: inline-block; font-weight: bold;">
        Go to Developer Portal
      </a>
    </div>
    <p style="font-size: 14px; color: #666; margin-top: 20px;">
      If you are not redirected automatically, click the button above.
    </p>
  </div>
</body>

</html>
