<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hardware SDK Examples</title>
  <script>
    // 统一路由分发器 - 处理所有未匹配的路径
    (function() {
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      const fullUrl = search + hash;
      
      console.log('Route dispatcher: handling path', path);
      
      // 处理子应用的客户端路由
      if (path.startsWith('/new-example/')) {
        // 对于 new-example 的子路由，重定向到首页并保存路径信息
        const subPath = path.substring('/new-example'.length);
        if (subPath && subPath !== '/') {
          sessionStorage.setItem('redirectPath', path + fullUrl);
          window.location.replace('/new-example/' + fullUrl);
          return;
        }
      }
      
      if (path.startsWith('/expo-example/')) {
        // 对于 expo-example 的子路由，重定向到首页并保存路径信息
        const subPath = path.substring('/expo-example'.length);
        if (subPath && subPath !== '/') {
          sessionStorage.setItem('redirectPath', path + fullUrl);
          window.location.replace('/expo-example/' + fullUrl);
          return;
        }
      }
      
      // 精确匹配规则
      if (path === '/' || path === '') {
        // 根路径重定向到 expo-example 的默认页面
        window.location.replace('/expo-example/api-payload' + fullUrl);
        return;
      }
      
      // 处理包含旧路径格式的情况 - 添加向后兼容性
      if (path.includes('/hardware-js-sdk/')) {
        if (path.includes('/new-example')) {
          const correctedPath = '/new-example' + path.split('/new-example')[1];
          window.location.replace(correctedPath + fullUrl);
          return;
        }
        if (path.includes('/expo-example')) {
          const correctedPath = '/expo-example' + path.split('/expo-example')[1];
          window.location.replace(correctedPath + fullUrl);
          return;
        }
        // 默认重定向旧的 hardware-js-sdk 路径到 expo-example
        window.location.replace('/expo-example/api-payload' + fullUrl);
        return;
      }
      
      // 默认情况：对于不是 /expo-example/ 和 /new-example/ 开头的路径，跳转到 expo-example 首页
      console.log('Route dispatcher: default redirect to expo-example');
      window.location.replace('/expo-example/api-payload' + fullUrl);
    })();
  </script>
</head>
<body>
  <div style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
    <h2>Page Not Found (404)</h2>
    <p>The requested page could not be found.</p>
    <p>You can visit one of our examples:</p>
    <ul style="list-style: none; padding: 0;">
      <li style="margin: 10px 0;"><a href="/expo-example/" style="color: #007bff; text-decoration: none;">📱 Expo Example</a></li>
      <li style="margin: 10px 0;"><a href="/new-example/" style="color: #007bff; text-decoration: none;">🆕 New Example</a></li>
    </ul>
    <p style="margin-top: 30px; font-size: 14px; color: #666;">
      Current path: <code id="current-path"></code>
    </p>
    <script>
      document.getElementById('current-path').textContent = window.location.pathname;
    </script>
  </div>
</body>
</html>
