name: Build Developer Portal

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies (Developer Portal)
        working-directory: packages/developer-portal
        run: yarn install

      - name: Build Developer Portal
        working-directory: packages/developer-portal
        env:
          NEXT_PUBLIC_SDK_VERSION: ${{ steps.version.outputs.sdk_version }}
          NEXT_PUBLIC_COMMIT_ID: ${{ github.sha }}
          NEXT_PUBLIC_COMMIT_SHORT: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.repository.updated_at }}
        run: |
          # Get SDK version from core package
          SDK_VERSION=$(node -p "require('../core/package.json').version")
          export NEXT_PUBLIC_SDK_VERSION=$SDK_VERSION
          export NEXT_PUBLIC_COMMIT_SHORT=${GITHUB_SHA:0:7}
          export NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Building with SDK_VERSION=$SDK_VERSION, COMMIT=${GITHUB_SHA:0:7}"
          yarn build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: developer-portal-${{ github.sha }}
          path: ./packages/developer-portal/out/
          retention-days: 7

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
