name: Build and Deploy Examples

on: workflow_dispatch

jobs:
  build_expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: |
          yarn
          yarn bootstrap
      - name: Build All Packages
        run: yarn build
      - name: Build Expo Example
        run: EXPO_PUBLIC_COMMIT_SHA=${GITHUB_SHA:0:7} yarn expo export:web
        working-directory: packages/connect-examples/expo-example
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-build
          path: packages/connect-examples/expo-example/web-build

  build_new_example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: yarn
      - name: Build New Example
        run: VITE_COMMIT_SHA=${GITHUB_SHA:0:7} yarn workspace onekeyexample run build -- --base=/hardware-js-sdk/new-example/
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-example-build
          path: packages/connect-examples/new-example/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [build_expo, build_new_example]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Deploy Directory
        run: mkdir -p deploy
      - name: Download Expo Artifact
        uses: actions/download-artifact@v4
        with:
          name: expo-build
          path: deploy/expo-example
      - name: Download New Example Artifact
        uses: actions/download-artifact@v4
        with:
          name: new-example-build
          path: deploy/new-example
      - name: Create Landing Page
        run: |
          cat > deploy/index.html <<EOL
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>OneKey Hardware SDK Examples</title>
              <style>
                  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
                  .container { text-align: center; }
                  h1 { color: #333; }
                  a { display: inline-block; margin: 10px; padding: 15px 30px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-size: 1.2em; }
                  a:hover { background-color: #0056b3; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>OneKey Hardware SDK Examples</h1>
                  <a href="./expo-example/">Expo Example</a>
                  <a href="./new-example/">New Example</a>
              </div>
          </body>
          </html>
          EOL
      - name: Add SPA fallback for client-side routing
        run: |
          cp deploy/expo-example/index.html deploy/expo-example/404.html
          cp deploy/new-example/index.html deploy/new-example/404.html
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          cname: example.onekey-test.com
          force_orphan: true
