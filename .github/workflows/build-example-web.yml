name: Build and Deploy Examples

on: workflow_dispatch

jobs:
  build_expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: |
          yarn
          yarn bootstrap
      - name: Build All Packages
        run: yarn build
      - name: Build Expo Example
        run: EXPO_PUBLIC_COMMIT_SHA=${GITHUB_SHA:0:7} yarn expo export:web
        working-directory: packages/connect-examples/expo-example
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-build
          path: packages/connect-examples/expo-example/web-build

  build_new_example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: |
          yarn
          yarn bootstrap
      - name: Build All Packages
        run: yarn build
      - name: Build New Example
        run: VITE_COMMIT_SHA=${GITHUB_SHA:0:7} yarn vite build --config vite.config.client.ts --base=/hardware-js-sdk/new-example/
        working-directory: packages/connect-examples/new-example
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-example-build
          path: packages/connect-examples/new-example/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [build_expo, build_new_example]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Deploy Directory
        run: mkdir -p deploy
      - name: Download Expo Artifact
        uses: actions/download-artifact@v4
        with:
          name: expo-build
          path: deploy/temp-expo
      - name: Download New Example Artifact
        uses: actions/download-artifact@v4
        with:
          name: new-example-build
          path: deploy/new-example
      - name: Setup Expo as Root and create routing
        run: |
          # Copy expo-example to root (default access)
          cp -r deploy/temp-expo/* deploy/
          # Create expo-example subdirectory for explicit routing
          mkdir -p deploy/expo-example
          cp -r deploy/temp-expo/* deploy/expo-example/
          # Clean up temp directory
          rm -rf deploy/temp-expo
      - name: Add SPA fallback for client-side routing
        run: |
          # Add 404.html for root (expo-example)
          cp deploy/index.html deploy/404.html
          # Add 404.html for new-example subdirectory
          cp deploy/new-example/index.html deploy/new-example/404.html
          # Add 404.html for expo-example subdirectory
          cp deploy/expo-example/index.html deploy/expo-example/404.html
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          # cname: example.onekey-test.com
          force_orphan: true
