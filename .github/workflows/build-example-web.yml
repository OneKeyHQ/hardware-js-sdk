name: Build and Deploy Examples

on: workflow_dispatch

env:
  COMMIT_SHORT_SHA: ${{ github.sha }}

jobs:
  build_expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get short commit SHA
        run: echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: |
          yarn
          yarn bootstrap
      - name: Build All Packages
        run: yarn build
      - name: Build Expo Example
        run: EXPO_PUBLIC_COMMIT_SHA=${{ env.COMMIT_SHORT_SHA }} yarn expo export:web
        working-directory: packages/connect-examples/expo-example

      - name: Add commit info to build output
        run: |
          # 先备份原始构建产物到临时目录
          mkdir -p temp-build
          cp -r web-build/* temp-build/ 2>/dev/null || true
          # 创建带有 commit id 的子目录
          mkdir -p web-build/commits/${{ env.COMMIT_SHORT_SHA }}
          # 复制备份的构建产物到带有 commit id 的目录
          cp -r temp-build/* web-build/commits/${{ env.COMMIT_SHORT_SHA }}/
          # 创建一个 commit 信息文件
          echo '{"commit": "${{ env.COMMIT_SHORT_SHA }}", "fullCommit": "${{ github.sha }}", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > web-build/commits/${{ env.COMMIT_SHORT_SHA }}/commit-info.json
          # 为 commit 版本也创建 404.html
          cp web-build/commits/${{ env.COMMIT_SHORT_SHA }}/index.html web-build/commits/${{ env.COMMIT_SHORT_SHA }}/404.html
          # 清理临时目录
          rm -rf temp-build
        working-directory: packages/connect-examples/expo-example

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-build
          path: packages/connect-examples/expo-example/web-build

  build_new_example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get short commit SHA
        run: echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: |
          yarn
          yarn bootstrap
      - name: Build All Packages
        run: yarn build
      - name: Build New Example
        run: VITE_COMMIT_SHA=${{ env.COMMIT_SHORT_SHA }} yarn vite build --config vite.config.client.ts --base=/hardware-js-sdk/new-example/
        working-directory: packages/connect-examples/new-example
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-example-build
          path: packages/connect-examples/new-example/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [build_expo, build_new_example]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get short commit SHA
        run: echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup Deploy Directory
        run: mkdir -p deploy
      - name: Download Expo Artifact
        uses: actions/download-artifact@v4
        with:
          name: expo-build
          path: deploy/temp-expo
      - name: Download New Example Artifact
        uses: actions/download-artifact@v4
        with:
          name: new-example-build
          path: deploy/new-example
      - name: Setup Expo as Root and create routing
        run: |
          # Copy expo-example to root (default access)
          cp -r deploy/temp-expo/* deploy/
          # Create expo-example subdirectory for explicit routing
          mkdir -p deploy/expo-example
          cp -r deploy/temp-expo/* deploy/expo-example/
          # Clean up temp directory
          rm -rf deploy/temp-expo
      - name: Add SPA fallback for client-side routing
        run: |
          # 为各子应用创建简单的 SPA 回退 404.html
          cp deploy/new-example/index.html deploy/new-example/404.html
          cp deploy/expo-example/index.html deploy/expo-example/404.html

          # 创建统一的根 404.html - 作为唯一的路由分发器
          cat > deploy/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Hardware SDK Examples</title>
            <script>
              // 统一路由分发器 - 处理所有未匹配的路径
              (function() {
                const path = window.location.pathname;
                const search = window.location.search;
                const hash = window.location.hash;
                const fullUrl = search + hash;
                
                console.log('Route dispatcher: handling path', path);
                
                // 精确匹配规则
                if (path === '/hardware-js-sdk' || path === '/hardware-js-sdk/') {
                  // 根路径重定向到 expo-example
                  window.location.replace('/hardware-js-sdk/expo-example/' + fullUrl);
                  return;
                }
                
                if (path.startsWith('/hardware-js-sdk/new-example/')) {
                  // new-example 路径，确保正确访问
                  window.location.replace(path + fullUrl);
                  return;
                }
                
                if (path.startsWith('/hardware-js-sdk/expo-example/')) {
                  // expo-example 路径，确保正确访问
                  window.location.replace(path + fullUrl);
                  return;
                }
                
                // 处理已知的 expo-example 路由
                const knownExpoRoutes = [
                  'api-payload', 
                  'firmware-update-test', 
                  'passphrase-test', 
                  'address-test', 
                  'security-check', 
                  'functional-testing'
                ];
                
                if (path.startsWith('/hardware-js-sdk/')) {
                  const relativePath = path.substring('/hardware-js-sdk/'.length);
                  
                  // 如果是已知的 expo 路由，重定向到 expo-example
                  if (knownExpoRoutes.includes(relativePath)) {
                    window.location.replace('/hardware-js-sdk/expo-example/' + relativePath + fullUrl);
                    return;
                  }
                }
                
                // 处理错误的路径格式
                if (path.includes('/new-example')) {
                  // 修正 new-example 路径
                  const correctedPath = '/hardware-js-sdk/new-example' + path.split('/new-example')[1];
                  window.location.replace(correctedPath + fullUrl);
                  return;
                }
                
                if (path.includes('/expo-example')) {
                  // 修正 expo-example 路径
                  const correctedPath = '/hardware-js-sdk/expo-example' + path.split('/expo-example')[1];
                  window.location.replace(correctedPath + fullUrl);
                  return;
                }
                
                // 默认情况：重定向到 expo-example
                console.log('Route dispatcher: default redirect to expo-example');
                window.location.replace('/hardware-js-sdk/expo-example/' + fullUrl);
              })();
            </script>
          </head>
          <body>
            <div style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
              <h2>Hardware SDK Examples</h2>
              <p>Redirecting to the appropriate example...</p>
              <p>If you are not redirected automatically, please visit:</p>
              <ul style="list-style: none; padding: 0;">
                <li><a href="/hardware-js-sdk/expo-example/">Expo Example</a></li>
                <li><a href="/hardware-js-sdk/new-example/">New Example</a></li>
              </ul>
            </div>
          </body>
          </html>
          EOF
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          cname: example.onekey-test.com
          force_orphan: true
