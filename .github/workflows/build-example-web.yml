name: Build and Deploy Examples

on: workflow_dispatch

env:
  COMMIT_SHORT_SHA: ${{ github.sha }}

jobs:
  build_expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Get short commit SHA
        run: echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: |
          yarn
          yarn bootstrap
      - name: Build All Packages
        run: yarn build
      - name: Build Expo Example
        run: EXPO_PUBLIC_COMMIT_SHA=${{ env.COMMIT_SHORT_SHA }} yarn expo export:web
        working-directory: packages/connect-examples/expo-example
        
      - name: Add commit info to build output
        run: |
          # 创建带有 commit id 的子目录
          mkdir -p web-build/commits/${{ env.COMMIT_SHORT_SHA }}
          # 复制构建产物到带有 commit id 的目录
          cp -r web-build/* web-build/commits/${{ env.COMMIT_SHORT_SHA }}/
          # 创建一个 commit 信息文件
          echo '{"commit": "${{ env.COMMIT_SHORT_SHA }}", "fullCommit": "${{ github.sha }}", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > web-build/commits/${{ env.COMMIT_SHORT_SHA }}/commit-info.json
          # 为 commit 版本也创建 404.html
          cp web-build/commits/${{ env.COMMIT_SHORT_SHA }}/index.html web-build/commits/${{ env.COMMIT_SHORT_SHA }}/404.html
        working-directory: packages/connect-examples/expo-example
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-build
          path: packages/connect-examples/expo-example/web-build

  build_new_example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Get short commit SHA
        run: echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: |
          yarn
          yarn bootstrap
      - name: Build All Packages
        run: yarn build
      - name: Build New Example
        run: VITE_COMMIT_SHA=${{ env.COMMIT_SHORT_SHA }} yarn vite build --config vite.config.client.ts --base=/hardware-js-sdk/new-example/
        working-directory: packages/connect-examples/new-example
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-example-build
          path: packages/connect-examples/new-example/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [build_expo, build_new_example]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Get short commit SHA
        run: echo "COMMIT_SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
        
      - name: Setup Deploy Directory
        run: mkdir -p deploy
      - name: Download Expo Artifact
        uses: actions/download-artifact@v4
        with:
          name: expo-build
          path: deploy/temp-expo
      - name: Download New Example Artifact
        uses: actions/download-artifact@v4
        with:
          name: new-example-build
          path: deploy/new-example
      - name: Setup Expo as Root and create routing
        run: |
          # Copy expo-example to root (default access)
          cp -r deploy/temp-expo/* deploy/
          # Create expo-example subdirectory for explicit routing
          mkdir -p deploy/expo-example
          cp -r deploy/temp-expo/* deploy/expo-example/
          # Clean up temp directory
          rm -rf deploy/temp-expo
      - name: Add SPA fallback for client-side routing
        run: |
          # 为 new-example 创建 404.html（Vite 构建的应用需要这个）
          cp deploy/new-example/index.html deploy/new-example/404.html

          # 为 expo-example 创建智能的 404.html，处理路由重定向
          cat > deploy/expo-example/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Redirecting...</title>
            <script>
              // 获取当前路径，移除 /hardware-js-sdk/expo-example 前缀
              const fullPath = window.location.pathname;
              const basePath = '/hardware-js-sdk/expo-example';
              
              // 如果路径以基础路径开头，提取相对路径
              if (fullPath.startsWith(basePath)) {
                const relativePath = fullPath.substring(basePath.length) || '/';
                // 重定向到正确的路径，保持查询参数和 hash
                const newUrl = basePath + '/' + (relativePath.startsWith('/') ? relativePath.substring(1) : relativePath);
                window.location.replace(newUrl + window.location.search + window.location.hash);
              } else {
                // 如果不是预期的路径格式，重定向到 expo-example 首页
                window.location.replace('/hardware-js-sdk/expo-example/');
              }
            </script>
          </head>
          <body>
            <div>Redirecting...</div>
          </body>
          </html>
          EOF

          # 改进根 404.html - 更智能的路由分发
          cat > deploy/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Redirecting...</title>
            <script>
              const path = window.location.pathname;
              const search = window.location.search;
              const hash = window.location.hash;
              
              // 更精确的路由分发逻辑
              if (path.startsWith('/hardware-js-sdk/new-example/')) {
                // new-example 的路由，重定向到正确路径
                window.location.replace(path + search + hash);
              } else if (path.startsWith('/hardware-js-sdk/expo-example/')) {
                // expo-example 的路由，重定向到正确路径
                window.location.replace(path + search + hash);
              } else if (path.includes('/new-example')) {
                // 包含 new-example 但路径不正确，修正路径
                const correctedPath = path.replace(/.*\/new-example/, '/hardware-js-sdk/new-example');
                window.location.replace(correctedPath + search + hash);
              } else if (path.includes('/expo-example')) {
                // 包含 expo-example 但路径不正确，修正路径
                const correctedPath = path.replace(/.*\/expo-example/, '/hardware-js-sdk/expo-example');
                window.location.replace(correctedPath + search + hash);
              } else if (path.startsWith('/hardware-js-sdk/') && !path.startsWith('/hardware-js-sdk/new-example') && !path.startsWith('/hardware-js-sdk/expo-example')) {
                // 其他 hardware-js-sdk 路径，假设是 expo-example 的路由
                const relativePath = path.substring('/hardware-js-sdk/'.length);
                window.location.replace('/hardware-js-sdk/expo-example/' + relativePath + search + hash);
              } else {
                // 默认重定向到根页面（expo-example）
                window.location.replace('/hardware-js-sdk/' + search + hash);
              }
            </script>
          </head>
          <body>
            <div>Redirecting...</div>
          </body>
          </html>
          EOF
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          cname: example.onekey-test.com
          force_orphan: true
