name: publish-npm-package

on: workflow_dispatch

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version-info.outputs.version }}
      is_prerelease: ${{ steps.version-info.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn
          yarn bootstrap

      - name: Build Target
        run: yarn build

      - name: Get version information
        id: version-info
        run: |
          # Get version from core package (assuming independent versioning)
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "📦 Package version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a prerelease version (contains -)
          if [[ "$VERSION" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "📦 Detected prerelease version: $VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "📦 Detected stable version: $VERSION"
          fi

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "📦 Publishing packages to NPM"
          yarn publish-packages --yes --no-verify-access

      - name: Create Git Tag
        run: |
          VERSION=${{ steps.version-info.outputs.version }}
          echo "🏷️ Creating tag: v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "✅ Tag v$VERSION created successfully"
