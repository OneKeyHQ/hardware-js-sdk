name: Publish NPM Packages & Create Release

on: workflow_dispatch

permissions:
  contents: write
  id-token: write

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          yarn
          yarn bootstrap

      - name: Build packages
        run: |
          echo "🔨 Building packages..."
          yarn build

      - name: Get version information
        id: version-info
        run: |
          # Get version from core package (assuming independent versioning)
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "📦 Package version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a prerelease version (contains -)
          if [[ "$VERSION" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "📦 Detected prerelease version: $VERSION"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "📦 Detected stable version: $VERSION"
          fi

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "📦 Publishing packages to NPM..."
          yarn publish-packages --yes --no-verify-access
          echo "✅ Packages published successfully"

      - name: Check Release Strategy
        run: |
          VERSION=${{ steps.version-info.outputs.version }}
          IS_PRERELEASE=${{ steps.version-info.outputs.is_prerelease }}

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "📦 Prerelease version detected: $VERSION"
            echo "⏭️ Skipping Git tag and GitHub release creation"
            echo "✅ Only NPM publication completed"
          else
            echo "🚀 Stable version detected: $VERSION"
            echo "📋 Will create Git tag and GitHub release"
          fi

      - name: Create Git Tag
        if: steps.version-info.outputs.is_prerelease == 'false'
        run: |
          VERSION=${{ steps.version-info.outputs.version }}
          TAG_NAME="v$VERSION"
          echo "🏷️ Creating tag: $TAG_NAME"

          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          echo "✅ Tag $TAG_NAME created successfully"

      - name: Create GitHub Release
        if: steps.version-info.outputs.is_prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version-info.outputs.version }}
          TAG_NAME="v$VERSION"

          echo "🚀 Creating GitHub release for $TAG_NAME"

          # Wait a moment for the tag to be available
          sleep 5

          # Check if release already exists
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Release $TAG_NAME already exists"
            exit 0
          fi

          # Create stable release with auto-generated notes
          echo "📦 Creating stable release..."
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            --verify-tag \
            --latest

          echo "✅ GitHub release created successfully"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
